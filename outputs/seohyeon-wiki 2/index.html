<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17118e" />
  <title>서현위키</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" aria-label="서현위키 홈" data-view="home">
        <span class="crest"><span>서현</span><i>SH</i></span>
        <span class="brand-name">서현위키</span>
      </button>
      <form class="top-search" id="topSearchForm" role="search">
        <input id="topSearchInput" aria-label="문서 검색" maxlength="100" placeholder="서현고등학교에 대해 궁금한 정보를 검색하세요." autocomplete="off" />
        <button class="icon-button search-submit" aria-label="검색" type="submit"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m16 16 4.3 4.3"></path></svg></button>
      </form>
      <button class="icon-button shuffle-button" id="randomButton" title="랜덤 문서" aria-label="랜덤 문서"><svg viewBox="0 0 24 24"><path d="M17 3h4v4M3 7h2.5c4 0 5.2 10 9 10H21M17 17h4v4M3 17h2.5c1.6 0 2.7-1.6 3.7-3.4M13 10.4c.5-1.7 1.2-3.4 2.5-3.4H21"></path></svg></button>
      <div class="topbar-spacer"></div>
      <button class="icon-button theme-button" id="themeButton" type="button" title="다크 모드로 전환" aria-label="다크 모드로 전환"><svg viewBox="0 0 24 24" class="sun-icon"><circle cx="12" cy="12" r="3.7"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg><svg viewBox="0 0 24 24" class="moon-icon"><path d="M20.5 15.4A8.5 8.5 0 0 1 8.6 3.5 8.6 8.6 0 1 0 20.5 15.4Z"></path></svg></button>
      <button class="account-button" id="accountButton"><span class="avatar" id="avatarInitial">🙂</span><span id="accountLabel">로그인</span><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg></button>
    </header>

    <main id="mainContent" tabindex="-1"></main>
    <footer class="site-footer"><span>서현위키</span><span>우리 학교의 이야기를 함께 기록해요.</span><button type="button" id="footerAbout">이용 안내</button></footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <div class="sr-only" id="liveRegion" aria-live="polite"></div>
  <script>if(location.hostname === "localhost" && new URLSearchParams(location.search).has("appcheckdebug")) self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;</script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
